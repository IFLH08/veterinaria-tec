name: CI - Calidad, Optimización y Seguridad

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ========================================================
  # 1. ESCANEO DE SEGURIDAD Y FUGAS DE INFORMACIÓN (SECRETS)
  # ========================================================
  security-audit:
    name: 🛡️ Auditoría de Seguridad y Secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar detector de secretos y APIs sensibles
        run: node scripts/audit.js

      - name: Escaneo profundo con TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  # ========================================================
  # 2. VALIDACIÓN DE CALIDAD, REDUNDANCIA Y OPTIMIZACIÓN
  # ========================================================
  code-quality:
    name: ⚡ Análisis de Redundancia y Optimización
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis y estructura HTML (HTMLHint)
        run: npx htmlhint index.html

      - name: Análisis de redundancia y código duplicado (jscpd)
        run: |
          npx jscpd . \
            --threshold 10 \
            --ignore "node_modules,package-lock.json,.git,scripts" \
            --reporters "console"

      - name: Verificación de presupuesto de peso y optimización de recursos
        run: |
          FILE_SIZE=$(wc -c < index.html)
          MAX_SIZE=256000 # 250 KB
          echo "Tamaño de index.html: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::El archivo excede el presupuesto máximo de rendimiento (250 KB)."
            exit 1
          else
            echo "✅ Presupuesto de peso respetado (< 250 KB)."
          fi

  # ========================================================
  # 3. PUBLICACIÓN AUTOMÁTICA EN GITHUB PAGES (OPCIONAL)
  # ========================================================
  deploy-pages:
    name: 🚀 Despliegue en GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [security-audit, code-quality]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
